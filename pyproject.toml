[project]
name = "warm-intro"
version = "0.1.0"
description = "Warm-introduction pathfinding over public professional information."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70.0",
]

[project.scripts]
warm-intro = "warm_intro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warm_intro*"]
